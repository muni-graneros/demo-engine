<!doctype html>
<html lang="es"><head><meta charset="utf-8"><style>
  /* Todo el tamaño cuelga de --k (lienzo.ancho / 1920) para que la tarjeta se vea igual
     en un lienzo de 1280 o de 3840 sin recalcular cada medida en el JS. */
  html,body { margin:0; width:100%; height:100%; overflow:hidden; }
  body { font-family:system-ui,'Segoe UI',Roboto,sans-serif; display:flex;
         align-items:center; justify-content:center; }
  /* Panel casi blanco: el fondo de marca puede ser claro u oscuro según el sistema, así que
     el texto no se apoya en él; se apoya en el panel, donde el contraste está garantizado. */
  #panel { position:relative; background:rgba(255,255,255,.97); border-radius:calc(28px*var(--k));
           padding:calc(56px*var(--k)) calc(72px*var(--k)) calc(64px*var(--k));
           box-shadow:0 calc(30px*var(--k)) calc(60px*var(--k)) rgba(0,0,0,.35); }
  #titulo { margin:0 0 calc(48px*var(--k)); text-align:center; color:#0f172a;
            font-size:calc(40px*var(--k)); font-weight:700; }
  .fila { display:flex; justify-content:center; gap:calc(140px*var(--k)); }
  .fila + .fila { margin-top:calc(72px*var(--k)); }
  .nodo { position:relative; z-index:1; box-sizing:border-box; width:calc(300px*var(--k));
          padding:calc(28px*var(--k)) calc(20px*var(--k)); background:#fff;
          border:calc(2px*var(--k)) solid #cbd5e1; border-radius:calc(20px*var(--k));
          display:flex; flex-direction:column; align-items:center; text-align:center; }
  /* 48 px de ícono: escala con el lienzo como el resto. */
  .icono { width:calc(48px*var(--k)); height:calc(48px*var(--k)); }
  .nombre { margin-top:calc(16px*var(--k)); color:#0f172a; font-size:calc(28px*var(--k));
            font-weight:700; line-height:1.2; }
  .quien { margin-top:calc(8px*var(--k)); color:#334155; font-size:calc(20px*var(--k)); line-height:1.3; }
  /* Activa: borde de 4 px del color de la superficie (lo pone el JS) + escala 1.08. */
  .nodo.activa { border-width:calc(4px*var(--k)); transform:scale(1.08);
                 box-shadow:0 calc(12px*var(--k)) calc(28px*var(--k)) rgba(15,23,42,.25); }
  /* La etiqueta es lo que hace que el estado NO dependa solo del color (WCAG 1.4.1). */
  .etiqueta { position:absolute; top:calc(-22px*var(--k)); left:50%; transform:translateX(-50%);
              white-space:nowrap; padding:calc(6px*var(--k)) calc(16px*var(--k));
              border-radius:999px; font-size:calc(20px*var(--k)); font-weight:700; }
  #flechas { position:absolute; inset:0; width:100%; height:100%; z-index:0; overflow:visible; }
</style></head>
<body>
  <div id="panel">
    <svg id="flechas" aria-hidden="true"></svg>
    <h1 id="titulo"></h1>
    <div id="nodos"></div>
  </div>
</body></html>
