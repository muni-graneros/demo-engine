name: CI

on:
  # Manual, push a main y develop, y PRs hacia cualquiera de las dos.
  #
  # `develop` estaba fuera, y en este ecosistema el trabajo diario va justamente
  # ahí: cada push a la rama donde se desarrolla pasaba sin correr una sola
  # prueba, y el CI solo avisaba al integrar, cuando el cambio ya está mezclado
  # con otros y cuesta más saber cuál lo rompió.
  #
  # El argumento de «no correr en cada rama para no hacer ruido» sigue valiendo
  # para las ramas de trabajo sueltas: éstas son las dos ramas que importan.
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: node --test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # El historial completo trae los tags: la prueba de versión necesita
          # leer package.json dentro del tag publicado, aunque esté en develop
          # y main haya recibido su contenido mediante squash.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # ffmpeg viene con ffmpeg-static (dependencia del paquete) — no hace falta
      # instalarlo aparte. Las pruebas de voz que necesitan los modelos (~670 MB) se
      # saltan solas sin DEMO_CON_VOZ: no se instalan acá, y eso es lo correcto (queda
      # 1 prueba SKIP, no una prueba roja por un modelo ausente).
      - name: Instalar navegador (Chromium) para Playwright
        # `--with-deps` hace un `apt-get update` que arrastra TODAS las fuentes del
        # runner, incluida la de Google Chrome que la imagen trae de fábrica. Ese
        # índice falla a ratos con «Hash Sum mismatch» (Google lo republica sin
        # sincronizar sus réplicas) y tumba el job aunque no usemos ese Chrome:
        # Playwright trae su propio Chromium. Sacar la fuente antes de instalar
        # deja el job dependiendo solo de los espejos de Ubuntu. Mismo fix que en
        # discapacidad-graneros (commit 65e8a9b).
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          npx playwright install --with-deps chromium

      # Concurrencia serializada a propósito, NO reintento. La suite tiene una
      # intermitencia MEDIDA (ver pruebas/voz-motores.test.mjs y src/voz/proceso.mjs):
      # bajo carga, con varios navegadores y ffmpeg compitiendo por el mismo runner,
      # fork/exec de un proceso real falla de forma transitoria (~1 de cada 8 corridas
      # medido en local). La causa es contención, no un bug — así que la solución es
      # sacarle la concurrencia que la provoca (--test-concurrency=1 serializa los
      # archivos de prueba, en vez de correr varios en paralelo), no reintentar tests
      # que fallaron. Un reintento (por test o por job) haría que una regresión real
      # también pudiera "pasar" en el segundo intento si toca a algo con timing
      # variable; serializar en cambio achica la ventana de contención SIN volver a
      # ejecutar nada que ya falló, así que un rojo acá sigue significando "hay que
      # mirarlo". El costo es tiempo de CI nomás (repo público, minutos gratis): pasa de
      # ~50s a ~1m45s en local con la máquina ya ocupada por otras cosas.
      - name: Ejecutar pruebas (node --test)
        run: node pruebas/correr.mjs --test-concurrency=1
